<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>LMS 보강권 자동화</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">LMS 자동화</span>
        <button id="theme-toggle" class="icon-btn" title="테마 전환">🌙</button>
      </div>

      <nav class="nav-section">
        <div class="nav-title">작업 목록</div>
        <ul id="job-nav-list" class="nav-list"></ul>
      </nav>

      <nav class="nav-section">
        <div class="nav-title">설치가 필요한 목록</div>
        <ul id="install-nav-list" class="nav-list"></ul>
      </nav>
    </aside>

    <main class="main-content" id="main-content"></main>
  </div>

  <div id="install-confirm-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Selenium 설치</h3>
      <p>Selenium이 설치되어 있지 않습니다. 지금 설치할까요? (pip install)</p>
      <pre id="install-log" class="install-log hidden"></pre>
      <div class="modal-actions">
        <button id="install-cancel-btn" class="btn btn-ghost">취소</button>
        <button id="install-confirm-btn" class="btn btn-primary">설치</button>
      </div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/views/morningSpecialStats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
